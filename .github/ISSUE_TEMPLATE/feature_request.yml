name: '💡 Feature Request'
description: Suggest an idea or enhancement for JMCC
title: '[FEATURE]: '
labels: ['enhancement', 'discussion']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make JMCC even better? We'd love to hear your proposal!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've thought of.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context or mockups about the feature request here.
